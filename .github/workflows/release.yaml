name: release

# Cutting a release:
#   Actions -> release -> Run workflow, from main.
#
# The version is COMPUTED, not typed: 1.0.0-rc(1000 + this workflow's run number), matching the
# 1.0.0-rc* stream the sibling packages publish. Nobody picks a number, so nobody picks a duplicate
# or a number that sorts backwards - a version can be unlisted on nuget.org but never removed.
#
# The tag is created by this workflow *after* a successful publish, so it always names something
# that actually shipped. That is the opposite of the previous arrangement, where the tag was the
# input; a tag can be pushed before anyone knows whether the build passes.
#
# Requires a NUGET_API_KEY repository secret with push rights for the ValidationModules.* IDs.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override the computed version, e.g. 1.0.0 for a stable release. Leave blank for 1.0.0-rc(1000 + run number).'
        required: false

env:
  # The release line. Bump alongside VersionPrefix in Directory.Build.props.
  RC_VERSION_PREFIX: '1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # See build-package.yaml: the 10.0 SDK builds, the 8.0 runtime runs the net8.0 tests.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # The dispatch selector remembers the last branch used, so without this an unreviewed
          # branch could be published to nuget.org, where a version can be unlisted but never
          # removed.
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Releases may only be run from main. This run is on '${GITHUB_REF_NAME}'."
            exit 1
          fi

          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
            echo "Version supplied explicitly."
          else
            VERSION="${RC_VERSION_PREFIX}-rc$((1000 + GITHUB_RUN_NUMBER))"
            echo "Version computed from run number ${GITHUB_RUN_NUMBER}."
          fi

          # Guards the override path; the computed path cannot produce a bad version.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semantic version"
            exit 1
          fi

          # A tag that already exists means this run number has been used, which should be
          # impossible - but publishing over it would be worse than stopping.
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag 'v$VERSION' already exists."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - run: dotnet restore ValidationModules.sln

      - run: dotnet build ValidationModules.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ValidationModules.sln --no-build --configuration Release

      - name: Verify Native AOT publish
        run: ./scripts/verify-aot.sh

      - name: Verify packages
        run: ./scripts/verify-packages.sh "${{ steps.version.outputs.version }}"

      # Listed explicitly rather than packing the solution, so that adding a test or
      # integration project never publishes one by accident. Extend as the stages land.
      - name: Pack
        run: |
          for project in \
            src/ValidationModules.Runtime/ValidationModules.Runtime.csproj \
            src/ValidationModules.AspNetCore/ValidationModules.AspNetCore.csproj \
            src/ValidationModules.SourceGenerator/ValidationModules.SourceGenerator.csproj \
            src/ValidationModules.SourceGenerator.Impl/ValidationModules.SourceGenerator.Impl.csproj; do
            dotnet pack "$project" --configuration Release --output ./artifacts \
              "/p:PackageVersion=${{ steps.version.outputs.version }}"
          done
          ls -la ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/*

      - name: Push to nuget.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/ipjohnson/index.json" \
            --skip-duplicate --no-symbols

      # Tagged only now, so the tag names something that was built, tested, verified and pushed.
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

          # A version carrying a prerelease label must not appear as a stable release.
          case "${VERSION}" in
            *-*) prerelease="--prerelease" ;;
            *)   prerelease="" ;;
          esac

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            ${prerelease} \
            ./artifacts/*.nupkg
