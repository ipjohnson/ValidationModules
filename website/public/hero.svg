<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="A constrained model on the left becoming straight-line generated validation code on the right">
  <defs>
    <linearGradient id="vmGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c79a"/>
      <stop offset="100%" stop-color="#0b7a5c"/>
    </linearGradient>

    <!-- Sits behind the panels so the mark reads on both the light and dark theme without
         needing two files. -->
    <radialGradient id="vmHalo" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#22c79a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22c79a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="320" fill="url(#vmHalo)"/>

  <!-- Left: the declaration. Attribute brackets over a model. -->
  <g transform="translate(24 78)">
    <rect width="108" height="164" rx="12" fill="none" stroke="url(#vmGlow)" stroke-width="2.5"/>

    <g fill="none" stroke="url(#vmGlow)" stroke-width="3" stroke-linecap="round">
      <path d="M20 26h34"/>
      <path d="M20 44h58"/>
      <path d="M20 78h34"/>
      <path d="M20 96h58"/>
      <path d="M20 130h34"/>
      <path d="M20 148h44"/>
    </g>

    <g fill="url(#vmGlow)" opacity="0.55">
      <rect x="20" y="20" width="8" height="8" rx="2"/>
      <rect x="20" y="72" width="8" height="8" rx="2"/>
      <rect x="20" y="124" width="8" height="8" rx="2"/>
    </g>
  </g>

  <!-- The build step. -->
  <g transform="translate(150 148)">
    <path d="M0 12h34" fill="none" stroke="url(#vmGlow)" stroke-width="3" stroke-linecap="round"/>
    <path d="M28 4l8 8-8 8" fill="none" stroke="url(#vmGlow)" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: the emitted code, with the check that says it ran at build time. -->
  <g transform="translate(188 78)">
    <rect width="108" height="164" rx="12" fill="none" stroke="url(#vmGlow)" stroke-width="2.5"/>

    <g fill="none" stroke="url(#vmGlow)" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <path d="M18 28h72"/>
      <path d="M18 46h54"/>
      <path d="M18 64h64"/>
      <path d="M18 82h44"/>
    </g>

    <g fill="none" stroke="url(#vmGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 124l14 14 30-30"/>
    </g>
  </g>
</svg>
