<svg xmlns="http://www.w3.org/2000/svg" width="42.75" height="36" viewBox="0 0 76 64" role="img" aria-label="ValidationModules">
  <!-- README-header mark: assets/icon.svg at an intrinsic 36px, so plain markdown renders it at the
       right size with no width attribute and the README header carries the same artwork nuget.org
       shows as the package icon beside the title. nuget.org renders CommonMark only, so a picture
       element for theme switching does not survive, and the README must reference this file by
       absolute raw.githubusercontent.com URL, which cannot size or theme it. One file has to serve
       both themes, so it is the tiled form, which carries its own ground. assets/logo.svg and
       logo-dark.svg remain the theme-switched pair for the docs site, which does render HTML.

       The viewBox runs 12 units past the 64-unit tile so the file carries its own gap before the
       heading text. A tile with a visible edge sits on the "V" otherwise: one markdown space is
       about half the width the eye wants there. -->
  <rect width="64" height="64" rx="12" fill="#16211B"/>
  <g transform="translate(8 8) scale(2)">
    <g fill="none" stroke="#EAF2ED" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 4.5H4.7V19.5H8"/>
      <path d="M16 4.5H19.3V19.5H16"/>
    </g>
    <rect x="9.1" y="9.1" width="5.8" height="5.8" rx="1.3" fill="#2FCF9C"/>
  </g>
</svg>
